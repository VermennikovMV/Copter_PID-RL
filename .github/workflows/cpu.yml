name: CPU research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_export.py
      - run: python -I -B scripts/check_local_package.py
      - run: python -I -B scripts/replay_controllers.py --controller all
      - run: python -I -B -m unittest discover -s qa -p test_research_evidence.py -v
      - run: python -I -B -m unittest discover -s qa -p test_demo_mission.py -v
      - run: python scripts/cpu_smoke.py
      - run: python -I -B -m unittest discover -s v2/tests -p test_joint_research_preflight_v1.py -v
      - run: python scripts/quickstart.py --seconds 2 --mission hover --scenario nominal
